{% extends "base.html" %}
{% block content %}

<div id="topbar">
  <img id="topbar-logo" src="/static/img/icon.ico" alt="Violet">
  <div id="topbar-right">
    <button class="btn btn-accent" id="btn-login">Iniciar sesi&oacute;n</button>
    <span id="topbar-email"></span>
    <button class="btn btn-secondary" id="btn-logout" style="display:none">Cerrar sesi&oacute;n</button>
  </div>
</div>
<hr class="divider">

<div id="main-layout">
  <!-- Col 1: Dropzone -->
  <div id="col-dropzone">
    <div class="card" id="card-dropzone">
      <div id="dropzone" class="dropzone">
        <div id="dropzone-empty" class="dropzone-empty">
          <div class="dropzone-icon">
            <svg width="40" height="40" viewBox="0 0 256 256" fill="currentColor"><path d="M216,72H131.31L104,44.69A15.88,15.88,0,0,0,92.69,40H40A16,16,0,0,0,24,56V200.62A15.41,15.41,0,0,0,39.39,216h177.5A15.13,15.13,0,0,0,232,200.89V88A16,16,0,0,0,216,72ZM40,56H92.69l16,16H40Z"/></svg>
          </div>
          <div class="dropzone-text">Arrastra archivos o carpetas aqu&iacute;</div>
        </div>
        <div class="dropzone-actions">
          <button class="btn btn-accent" id="btn-browse-files">Seleccionar archivos</button>
          <button class="btn btn-secondary" id="btn-browse-folder">Seleccionar carpeta</button>
        </div>
        <div id="items-toolbar">
          <span id="items-count"></span>
          <button class="btn btn-secondary" id="btn-remove-all">Eliminar todo</button>
        </div>
        <div id="items-list"></div>
      </div>
    </div>
  </div>

  <!-- Col 2: Upload + Webhooks -->
  <div id="col-upload">
    <div class="status-row" style="margin-bottom:8px;">
      <span class="dot" id="status-dot"></span>
      <span id="status-text">Sin actividad</span>
    </div>
    <div class="card" id="card-actions">
      <div class="action-row">
        <button class="btn btn-upload" id="btn-upload" disabled>
          <svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M74.34,77.66a8,8,0,0,1,0-11.32l48-48a8,8,0,0,1,11.32,0l48,48a8,8,0,0,1-11.32,11.32L136,43.31V128a8,8,0,0,1-16,0V43.31L85.66,77.66A8,8,0,0,1,74.34,77.66ZM240,136v64a16,16,0,0,1-16,16H32a16,16,0,0,1-16-16V136a16,16,0,0,1,16-16h68a4,4,0,0,1,4,4v3.46c0,13.45,11,24.79,24.46,24.54A24,24,0,0,0,152,128v-4a4,4,0,0,1,4-4h68A16,16,0,0,1,240,136Zm-40,32a12,12,0,1,0-12,12A12,12,0,0,0,200,168Z"/></svg>
          Subir
        </button>
        <button class="btn btn-cancel" id="btn-cancel" disabled>
          <svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"/></svg>
          Cancelar
        </button>
      </div>
      <div id="progress-wrapper" hidden>
        <div id="progress-track">
          <div id="progress-fill"></div>
        </div>
        <span id="progress-text"></span>
      </div>
    </div>

    <div class="card" id="card-folder-name" hidden>
      <span class="card-label">NOMBRE DE CARPETA EN DRIVE</span>
      <input type="text" id="folder-name-input" placeholder="Subida DD-MM-AAAA">
    </div>

    <span class="section-label">WEBHOOKS DE DISCORD</span>
    <div id="webhooks-list"></div>

    <!-- Inline webhook editor -->
    <div id="webhook-editor" hidden>
      <div class="card">
        <span class="card-label" id="webhook-editor-title">EDITAR WEBHOOK</span>
        <label class="field-label">NOMBRE</label>
        <input id="webhook-edit-name" type="text" placeholder="Ej: Mi Canal">
        <label class="field-label" style="margin-top:8px;">URL DEL WEBHOOK</label>
        <input id="webhook-edit-url" type="text" class="wh-url" placeholder="https://discord.com/api/webhooks/...">
        <div class="action-row" style="margin-top:10px;justify-content:flex-end;">
          <button class="btn btn-secondary" id="btn-editor-cancel">Cancelar</button>
          <button class="btn btn-accent" id="btn-editor-save">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Col 3: Log -->
  <div id="col-log">
    <div class="card" id="card-log">
      <div class="log-header">
        <span class="card-label">REGISTRO DE ACTIVIDAD</span>
        <button class="btn btn-secondary" id="btn-clear-log" style="font-size:10px;padding:2px 8px;">Limpiar</button>
      </div>
      <hr class="divider">
      <div id="log-area"></div>
    </div>
  </div>
</div>

<!-- Hidden file inputs -->
<input type="file" id="file-input" multiple class="hidden-input">
<input type="file" id="folder-input" webkitdirectory directory class="hidden-input">

<div id="footer">
  <span>Violet Uploader v2</span>
  <span id="footer-toast"></span>
</div>
{% endblock %}
